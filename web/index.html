<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haze Garages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="modal-container">
            <header class="modal-header">
                <div class="header-brand">
                    <span class="brand-accent"></span>
                    <h1 id="garage-title">Haze Garages</h1>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="search-input" placeholder="Buscar modelo ou placa...">
                    </div>
                    <button id="close-btn" class="close-btn">&times;</button>
                </div>
            </header>
            <div class="modal-body">
                <div id="vehicle-list" class="vehicle-list">
                    <!-- Dynamic Vehicle Cards -->
                </div>
            </div>
            <footer class="modal-footer">
                <span class="footer-info">Haze Studios &copy; 2026</span>
            </footer>
        </div>

        <!-- Nickname Edit Prompt Modal -->
        <div id="nickname-modal" class="modal-overlay hidden">
            <div class="prompt-box">
                <div class="prompt-header">
                    <i class="fas fa-tag"></i>
                    <h3>Editar Apelido do Veículo</h3>
                </div>
                <div class="prompt-body">
                    <p id="prompt-plate-info">PLACA: ABC1234</p>
                    <input type="text" id="nickname-input" placeholder="Ex: Meu Adder de Corrida" maxlength="30" autocomplete="off">
                </div>
                <div class="prompt-footer">
                    <button id="cancel-nickname-btn" class="btn-cancel">CANCELAR</button>
                    <button id="save-nickname-btn" class="btn-save">SALVAR</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
